name: Sela
options:
  bundleIdPrefix: com.sela
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "9.2.0"
  swift-ai-sdk:
    url: https://github.com/teunlao/swift-ai-sdk.git
    exactVersion: "0.17.6"

targets:
  Sela:
    type: application
    platform: macOS
    sources:
      - Sela
    dependencies:
      - package: SwiftProtobuf
      - package: Sentry
        product: Sentry
      - package: swift-ai-sdk
        product: SwiftAISDK
      - package: swift-ai-sdk
        product: AISDKJSONSchema
      - package: swift-ai-sdk
        product: GoogleProvider
      - package: swift-ai-sdk
        product: OpenAIProvider
      - package: swift-ai-sdk
        product: AnthropicProvider
    info:
      path: Sela/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: com.sela.app
            CFBundleURLSchemes:
              - sela
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Sela.sdef
        NSAppleEventsUsageDescription: "Sela restarts ProPresenter so it reloads the translated song files you just saved."
        NSLocalNetworkUsageDescription: "Sela looks for ProPresenter on your local network so it can follow the focused playlist."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sela.app
        PRODUCT_NAME: Sela
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SelaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SelaTests
    dependencies:
      - target: Sela
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sela.app/Contents/MacOS/Sela"
